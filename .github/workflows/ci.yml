name: CI

# ╔══════════════════════════════════════════════════════════════════════════════════════╗
# ║  READ THIS BEFORE TRUSTING A GREEN PR.                                               ║
# ║                                                                                      ║
# ║  Almost everything in this workflow is OPT-IN. On an ordinary pull request with no    ║
# ║  `ci` label, the contracts / node / abi-drift jobs DO NOT RUN — they report           ║
# ║  "skipped", and GitHub renders a skipped required check the same shade of green as a  ║
# ║  passing one. A PR can be fully green and have had zero tests run against it.         ║
# ║                                                                                      ║
# ║  To actually check a PR: add the `ci` label (remove + re-add to re-run).              ║
# ║                                                                                      ║
# ║  There are TWO exceptions that run on every PR: `supply-chain` (lockfile integrity +  ║
# ║  audit, ungated because a lockfile edit is exactly what a malicious PR carries) and   ║
# ║  `abi-freshness`, which runs on every PR WITHOUT the                                  ║
# ║  `abi-unchanged` label, because it is seconds of pure git and needs no toolchain.     ║
# ║  It only proves that packages/abis/src was touched alongside a Solidity change — NOT  ║
# ║  that the committed ABIs are correct. Only the (label-gated) `abi-drift` job, which   ║
# ║  actually regenerates them with Foundry, proves that.                                 ║
# ║                                                                                      ║
# ║  If these jobs are ever promoted to REQUIRED status checks, the label gate must go    ║
# ║  first — otherwise "required" means "required to be skipped".                         ║
# ╚══════════════════════════════════════════════════════════════════════════════════════╝
#
# CI is OPT-IN to avoid burning Actions minutes on a pre-release, local-only project.
#
# It runs only when you ask for it, in one of two ways:
#   1. Add the `ci` label to a pull request (remove and re-add to re-run)
#   2. Actions tab -> CI -> "Run workflow" (workflow_dispatch), any branch
#
# There is deliberately NO `push` trigger. A same-repo PR fires both `push` and
# `pull_request`, so every job ran twice for the same commit — the duplicate
# "(push)" and "(pull_request)" checks were pure waste.
#
# Everything here is runnable locally and costs nothing:
#   pnpm check                    # lint + typecheck + test + format + syncpack + knip
#   pnpm turbo lint typecheck test
#   cd packages/contracts && forge test
#
# To make CI run on every push again, add back:
#   push:
#     branches: [main]
# and drop the `if:` guard on each job below.
on:
  pull_request:
    # `labeled` is required so adding the `ci` label starts a run on an existing PR.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  # UNGATED, like abi-freshness. This is the second exception to the opt-in rule, and it is
  # deliberate.
  #
  # Every other install site passes `--frozen-lockfile`, but they all sit behind the `ci`
  # label — so on an ordinary PR `--frozen-lockfile` never actually executed, and nothing
  # verified that a `pnpm-lock.yaml` change matched the manifests. With `^` ranges on
  # viem/wagmi/rainbowkit, the lockfile is the only thing standing between this repo and a
  # malicious minor release, and a lockfile edit is exactly what a supply-chain PR would carry.
  # Skipped checks render the same green as passing ones, so the gap was invisible.
  #
  # `--ignore-scripts` is the point of the job as much as the lockfile check: it means a
  # hostile postinstall in a newly-added dependency does not execute on a runner holding the
  # repo token, even while we are busy verifying that dependency.
  supply-chain:
    name: Supply chain (lockfile + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Fails if pnpm-lock.yaml disagrees with any package.json. This is the blocking half.
      - name: Verify lockfile matches manifests
        run: pnpm install --frozen-lockfile --ignore-scripts

      # ADVISORY, NOT BLOCKING — and that is a measured decision, not an oversight.
      #
      # Measured 2026-07-30 on this tree: 278 advisories (101 high, 7 critical); production-only
      # is still 72 high and 4 critical. `--audit-level=high` — or even `critical` — would fail
      # on the first run and stay failing, which does not make anything safer: a check that is
      # always red gets ignored, and it would block every unrelated PR from merging.
      #
      # Most of the browser-side weight is one dependency. `@hyperlane-xyz/sdk` is pulled into
      # apps/web for a single event decode and drags in protobufjs, @aws-sdk/client-s3, cosmjs,
      # axios, h3 and ws; it accounts for 30 of the 39 apps/web highs and all three browser
      # criticals. See V30 in PRPs/security-audit-2026-07-30.md — replacing it with a local
      # viem `parseEventLogs` deletes that subtree.
      #
      # FLIP THIS TO BLOCKING (drop continue-on-error) once the count is down to something a
      # human will actually read. Until then the output is here to be looked at, honestly
      # labelled, rather than silently absent.
      - name: Audit dependencies (advisory)
        continue-on-error: true
        run: pnpm audit --audit-level=high

  contracts:
    name: Contracts (forge)
    runs-on: ubuntu-latest
    # Opt-in: runs only on manual dispatch, or when the PR carries the `ci` label.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: stable

      - name: Check formatting
        working-directory: packages/contracts
        run: forge fmt --check

      - name: Build
        working-directory: packages/contracts
        run: forge build --sizes

      - name: Test
        working-directory: packages/contracts
        run: forge test

  node:
    name: Node (lint / typecheck / test)
    runs-on: ubuntu-latest
    # Opt-in: runs only on manual dispatch, or when the PR carries the `ci` label.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint / typecheck / test
        run: pnpm turbo lint typecheck test --filter='!@swr/contracts'

      - name: Prettier check
        run: pnpm exec prettier --check "**/*.{ts,tsx,js,json,md,mdx}"

      # The remaining two thirds of `pnpm check`. Without these, a labelled CI run was still
      # weaker than running `pnpm check` locally.
      - name: Dependency version consistency
        run: pnpm syncpack:check

      # NOT `pnpm knip` — the root script passes `--no-exit-code`, which makes it advisory by
      # construction and unable to fail anything. That form is right for a local script and
      # useless as a gate, so CI invokes knip directly.
      #
      # `--exclude unresolved` drops one known false-positive class: knip parses Tailwind v4
      # `@source "../components/**/*.tsx"` directives in packages/ui/src/styles/index.css as
      # CSS imports and reports the globs as unresolved. Delete this flag once knip.json
      # carries an `ignoreUnresolved` entry for them; every other issue class still fails.
      - name: Unused files, exports and dependencies
        run: pnpm exec knip --exclude unresolved

  abi-drift:
    name: ABI drift
    runs-on: ubuntu-latest
    # Opt-in: runs only on manual dispatch, or when the PR carries the `ci` label.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: stable

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate ABIs
        working-directory: packages/contracts
        run: |
          forge build
          pnpm export-abi

      # export-abi emits raw JSON.stringify output while the committed ABIs are
      # Prettier-formatted, so the formatter must run before diffing or every
      # run reports a whole-tree diff.
      - name: Format generated ABIs
        run: pnpm exec prettier --write "packages/abis/src/*.ts"

      - name: Fail if ABIs are stale
        run: git diff --exit-code -- packages/abis/src

  # The only job WITHOUT the `ci` label gate, deliberately.
  #
  # `packages/abis` is a source-only package: the TypeScript ABI constants are committed, it
  # has no build step, and nothing in the turbo graph depends on `@swr/contracts#export-abi`.
  # That is on purpose — wiring export-abi into the frontend build would make every
  # `turbo build` (including host builds with no Foundry installed) require the Solidity
  # toolchain. The cost is that `turbo build` will happily bundle apps/web against ABIs
  # generated from an arbitrarily old contract commit, and the authoritative check for that
  # (the abi-drift job above) is label-gated, so by default nothing catches it.
  #
  # This job closes that hole with the only check that is cheap enough to run unconditionally:
  # pure git, no toolchain, a few seconds. It cannot tell whether a Solidity change altered
  # the ABI — it only asserts that if `packages/contracts/src` changed, the generated ABIs
  # were regenerated alongside it. False positives (comment-only or implementation-only
  # edits) are expected and are cleared by regenerating anyway (the diff will be empty) or by
  # labelling the PR `abi-unchanged`.
  abi-freshness:
    name: ABI freshness (no label needed)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'abi-unchanged')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Contracts changed without regenerating ABIs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          if ! grep -qE '^packages/contracts/src/.*\.sol$' <<<"$changed"; then
            echo "No Solidity source changes — nothing to check."
            exit 0
          fi

          if grep -qE '^packages/abis/src/' <<<"$changed"; then
            echo "Solidity changed and packages/abis/src was regenerated alongside it."
            exit 0
          fi

          echo "::error::Solidity sources under packages/contracts/src changed but packages/abis/src was not regenerated. Run 'cd packages/contracts && forge build && pnpm export-abi' then 'pnpm exec prettier --write \"packages/abis/src/*.ts\"' and commit the result. If the change genuinely cannot affect the ABI, label the PR 'abi-unchanged'."
          exit 1
